const pl = new URLSearchParams(location.search).get('pl') || COURSES[0].id;
const course = COURSES.find(c=>c.id===pl) || COURSES[0];
let cur = 0, player, playerReady = false;
document.getElementById('title').textContent = course.name;
document.getElementById('pt').textContent = course.name + ' | أحمد وجدي';
document.getElementById('count').textContent = course.videos.length + ' درس';
const listEl = document.getElementById('lessons');
course.videos.forEach((v,i)=>{
  const d=document.createElement('div');d.className='lesson';d.dataset.i=i;
  d.innerHTML='<span class="num">'+(i+1)+'</span><span>'+v[1]+'</span>';
  d.onclick=()=>play(i);listEl.appendChild(d);
});
function mark(){document.querySelectorAll('.lesson').forEach(e=>e.classList.toggle('current',+e.dataset.i===cur));
  const c=listEl.children[cur]; if(c) c.scrollIntoView({block:'nearest'});
  document.getElementById('now').innerHTML='بيشتغل دلوقتي: <b>'+course.videos[cur][1]+'</b>';}
function play(i){cur=i;mark();var id=course.videos[i][0];
  if(player&&playerReady){try{player.loadVideoById(id);return;}catch(e){}}
  var fr=document.getElementById('ytframe');
  if(fr) fr.src='https://www.youtube.com/embed/'+id+'?rel=0&enablejsapi=1&autoplay=1&origin='+encodeURIComponent(location.origin);}
function onState(e){if(e.data===YT.PlayerState.ENDED && cur<course.videos.length-1) play(cur+1);}
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  var fr=document.getElementById('ytframe');
  fr.src='https://www.youtube.com/embed/'+course.videos[0][0]+'?rel=0&enablejsapi=1&origin='+encodeURIComponent(location.origin);
  player=new YT.Player(fr,{events:{onReady:function(){playerReady=true;mark();},onStateChange:onState}});
}
